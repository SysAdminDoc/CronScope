<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">

  body.theme-dark ::-webkit-scrollbar-track { background: #0a0e17; }
  body.theme-dark ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
  body.theme-dark ::-webkit-scrollbar-thumb:hover { background: #334155; }

  body.theme-light ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

<body class="theme-dark">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const VERSION = "0.3.0";
const FIELD_MODE_LABELS = { auto:"Auto", "5":"5 fields", "6":"6 fields + seconds", "7":"7 fields + seconds/year" };
const DIALECTS = {
  unix: { label:"Unix", requiresQuestion:false, allowQuestion:false, dowBase:"unix", awsYear:false },
  quartz: { label:"Quartz", requiresQuestion:true, allowQuestion:true, dowBase:"quartz", awsYear:false },
  kubernetes: { label:"Kubernetes", requiresQuestion:false, allowQuestion:false, dowBase:"unix", awsYear:false },
  github: { label:"GitHub Actions", requiresQuestion:false, allowQuestion:false, dowBase:"unix", awsYear:false },
  aws: { label:"AWS EventBridge", requiresQuestion:true, allowQuestion:true, dowBase:"quartz", awsYear:true },
};
const DEFAULT_PARSE_OPTIONS = { dialect:"unix", fieldMode:"auto", timezone:"local", dstAware:false };
const TIMEZONE_OPTIONS = ["local","UTC","America/New_York","America/Chicago","America/Denver","America/Los_Angeles","Europe/London","Europe/Berlin","Asia/Tokyo","Australia/Sydney"];
const PRESETS = [
  { label: "Every minute", expr: "* * * * *" },
  { label: "Every 5 minutes", expr: "*/5 * * * *" },
  { label: "Every hour", expr: "0 * * * *" },
  { label: "Every 6 hours", expr: "0 */6 * * *" },
  { label: "Daily at midnight", expr: "0 0 * * *" },
  { label: "Daily at 9 AM", expr: "0 9 * * *" },
  { label: "Weekdays at 9 AM", expr: "0 9 * * 1-5" },
  { label: "Weekly Sunday midnight", expr: "0 0 * * 0" },
  { label: "1st of month at noon", expr: "0 12 1 * *" },
  { label: "Every 15 min, work hours", expr: "*/15 9-17 * * 1-5" },
  { label: "Quarterly (Jan/Apr/Jul/Oct)", expr: "0 0 1 1,4,7,10 *" },
  { label: "Yearly Jan 1 midnight", expr: "0 0 1 1 *" },
];

// Named value maps for cron month and day-of-week fields
const MONTH_NAMES = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
const DOW_NAMES = {SUN:0,MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6};

// Cron aliases
const CRON_ALIASES = {
  "@yearly": "0 0 1 1 *", "@annually": "0 0 1 1 *",
  "@monthly": "0 0 1 * *", "@weekly": "0 0 * * 0",
  "@daily": "0 0 * * *", "@midnight": "0 0 * * *",
  "@hourly": "0 * * * *",
};

// Theme definitions
const THEMES = {
  dark: {
    bg: "#0a0e17", surface: "#111827", surfaceAlt: "#151d2e",
    border: "#1e293b", borderHover: "#334155",
    text: "#e2e8f0", textDim: "#64748b", textMuted: "#475569",
    accent: "#06b6d4", accentDim: "#0e7490", accentGlow: "rgba(6,182,212,0.15)",
    error: "#f43f5e", errorDim: "rgba(244,63,94,0.15)",
    green: "#10b981", orange: "#f59e0b", purple: "#a78bfa",
    modalOverlay: "rgba(0,0,0,0.6)",
  },
  light: {
    bg: "#f8fafc", surface: "#ffffff", surfaceAlt: "#f1f5f9",
    border: "#e2e8f0", borderHover: "#cbd5e1",
    text: "#1e293b", textDim: "#64748b", textMuted: "#94a3b8",
    accent: "#0891b2", accentDim: "#06b6d4", accentGlow: "rgba(8,145,178,0.1)",
    error: "#e11d48", errorDim: "rgba(225,29,72,0.1)",
    green: "#059669", orange: "#d97706", purple: "#7c3aed",
    modalOverlay: "rgba(0,0,0,0.3)",
  },
};
const EC = ["#06b6d4","#f59e0b","#a78bfa","#f43f5e","#10b981","#fb923c"];
const LOCAL_TIMEZONE = Intl.DateTimeFormat().resolvedOptions().timeZone || "local";
const TZ_FORMATTERS = new Map();
const ZONED_INSTANT_CACHE = new Map();

// Replace named month/day tokens with numeric equivalents
function resolveNamedValues(field, nameMap) {
  return field.replace(/[A-Za-z]+/g, token => {
    const up = token.toUpperCase();
    return nameMap[up] !== undefined ? String(nameMap[up]) : token;
  });
}

function getParseOptions(options) {
  const merged = Object.assign({}, DEFAULT_PARSE_OPTIONS, options || {});
  if (merged.timezone !== "local") {
    try { new Intl.DateTimeFormat("en-US", { timeZone:merged.timezone }).format(new Date()); }
    catch { merged.timezone = "local"; }
  }
  return merged;
}

function getDialectConfig(dialect) {
  return DIALECTS[dialect] || DIALECTS.unix;
}

function getFieldNames(options) {
  const opts = getParseOptions(options);
  const mode = opts.fieldMode;
  if (mode === "7") return ["Second","Minute","Hour","Day of Month","Month","Day of Week","Year"];
  if (mode === "6" && getDialectConfig(opts.dialect).awsYear) return ["Minute","Hour","Day of Month","Month","Day of Week","Year"];
  if (mode === "6") return ["Second","Minute","Hour","Day of Month","Month","Day of Week"];
  return ["Minute","Hour","Day of Month","Month","Day of Week"];
}

function expandAliasExpression(raw, options) {
  const alias = CRON_ALIASES[raw.toLowerCase()];
  if (!alias) return null;
  const opts = getParseOptions(options);
  if (opts.fieldMode === "6") return getDialectConfig(opts.dialect).awsYear ? alias + " *" : "0 " + alias;
  if (opts.fieldMode === "7") return "0 " + alias + " *";
  return alias;
}

function cleanCronExpression(raw, options) {
  const opts = getParseOptions(options);
  let text = raw.trim();
  if (opts.dialect === "aws") {
    const match = text.match(/^cron\((.*)\)$/i);
    if (match) text = match[1].trim();
  }
  return text;
}

function parseCronField(field, min, max, nameMap) {
  if (nameMap) field = resolveNamedValues(field, nameMap);
  const values = new Set();
  for (const part of field.split(",")) {
    if (part === "*") { for (let i = min; i <= max; i++) values.add(i); }
    else if (part.includes("/")) {
      const [range, stepStr] = part.split("/");
      const step = parseInt(stepStr, 10);
      if (isNaN(step) || step <= 0) return null;
      let start = min, end = max;
      if (range !== "*") {
        if (range.includes("-")) { const [a, b] = range.split("-").map(Number); start = a; end = b; }
        else start = parseInt(range, 10);
      }
      if (isNaN(start) || isNaN(end)) return null;
      for (let i = start; i <= end; i += step) values.add(i);
    } else if (part.includes("-")) {
      const [a, b] = part.split("-").map(Number);
      if (isNaN(a) || isNaN(b)) return null;
      for (let i = a; i <= b; i++) values.add(i);
    } else {
      const v = parseInt(part, 10);
      if (isNaN(v)) return null;
      values.add(v);
    }
  }
  for (const v of values) if (v < min || v > max) return null;
  return values;
}

function parseDayOfMonthField(field, options) {
  const opts = getParseOptions(options);
  const dialect = getDialectConfig(opts.dialect);
  const result = { values:new Set(), wildcard:false, noSpecific:false, specials:[], raw:field };
  if (field === "*") {
    result.wildcard = true;
    for (let i = 1; i <= 31; i++) result.values.add(i);
    return result;
  }
  if (field === "?") {
    if (!dialect.allowQuestion) return null;
    result.noSpecific = true;
    return result;
  }
  for (const part of field.split(",")) {
    const upper = part.toUpperCase();
    if (upper === "L") result.specials.push({ type:"lastDay", offset:0 });
    else if (/^L-\d+$/.test(upper)) result.specials.push({ type:"lastDay", offset:parseInt(upper.slice(2), 10) });
    else if (upper === "LW") result.specials.push({ type:"lastWeekday" });
    else if (/^\d+W$/.test(upper)) {
      const day = parseInt(upper.slice(0, -1), 10);
      if (day < 1 || day > 31) return null;
      result.specials.push({ type:"nearestWeekday", day });
    } else {
      const parsed = parseCronField(part, 1, 31);
      if (!parsed) return null;
      parsed.forEach(v => result.values.add(v));
    }
  }
  return result;
}

function parseDowNumber(token, options) {
  const opts = getParseOptions(options);
  const dialect = getDialectConfig(opts.dialect);
  const upper = token.toUpperCase();
  if (DOW_NAMES[upper] !== undefined) return DOW_NAMES[upper];
  const n = parseInt(token, 10);
  if (isNaN(n)) return null;
  if (dialect.dowBase === "quartz") {
    if (n < 1 || n > 7) return null;
    return n === 1 ? 0 : n - 1;
  }
  if (n === 7) return 0;
  if (n < 0 || n > 6) return null;
  return n;
}

function addDowRange(values, start, end, step) {
  if (start <= end) {
    for (let i = start; i <= end; i += step) values.add(i);
    return;
  }
  const wrapped = [];
  for (let i = start; i <= 6; i++) wrapped.push(i);
  for (let i = 0; i <= end; i++) wrapped.push(i);
  wrapped.forEach((v, idx) => { if (idx % step === 0) values.add(v); });
}

function parseDowSimplePart(part, options) {
  const values = new Set();
  const [rangePart, stepPart] = part.split("/");
  const step = stepPart === undefined ? 1 : parseInt(stepPart, 10);
  if (isNaN(step) || step <= 0) return null;
  if (rangePart === "*") {
    addDowRange(values, 0, 6, step);
    return values;
  }
  if (rangePart.includes("-")) {
    const [a, b] = rangePart.split("-");
    const start = parseDowNumber(a, options);
    const end = parseDowNumber(b, options);
    if (start === null || end === null) return null;
    addDowRange(values, start, end, step);
    return values;
  }
  const one = parseDowNumber(rangePart, options);
  if (one === null) return null;
  values.add(one);
  return values;
}

function parseDayOfWeekField(field, options) {
  const opts = getParseOptions(options);
  const dialect = getDialectConfig(opts.dialect);
  const result = { values:new Set(), wildcard:false, noSpecific:false, specials:[], raw:field };
  if (field === "*") {
    result.wildcard = true;
    for (let i = 0; i <= 6; i++) result.values.add(i);
    return result;
  }
  if (field === "?") {
    if (!dialect.allowQuestion) return null;
    result.noSpecific = true;
    return result;
  }
  for (const part of field.split(",")) {
    const upper = part.toUpperCase();
    if (/^[A-Z0-9]+L$/.test(upper) && upper.length > 1) {
      const dow = parseDowNumber(upper.slice(0, -1), options);
      if (dow === null) return null;
      result.specials.push({ type:"lastDow", dow });
    } else if (upper === "L") {
      result.specials.push({ type:"lastDow", dow:6 });
    } else if (upper.includes("#")) {
      const [dowToken, nthToken] = upper.split("#");
      const dow = parseDowNumber(dowToken, options);
      const nth = parseInt(nthToken, 10);
      if (dow === null || isNaN(nth) || nth < 1 || nth > 5) return null;
      result.specials.push({ type:"nthDow", dow, nth });
    } else {
      const parsed = parseDowSimplePart(upper, options);
      if (!parsed) return null;
      parsed.forEach(v => result.values.add(v));
    }
  }
  return result;
}

function determineCronLayout(parts, options) {
  const opts = getParseOptions(options);
  const dialect = getDialectConfig(opts.dialect);
  if (opts.fieldMode !== "auto") {
    if (parts.length !== Number(opts.fieldMode)) return null;
    if (opts.fieldMode === "5") return { hasSeconds:false, hasYear:false, second:null, minute:0, hour:1, dom:2, month:3, dow:4, year:null };
    if (opts.fieldMode === "6" && dialect.awsYear) return { hasSeconds:false, hasYear:true, second:null, minute:0, hour:1, dom:2, month:3, dow:4, year:5 };
    if (opts.fieldMode === "6") return { hasSeconds:true, hasYear:false, second:0, minute:1, hour:2, dom:3, month:4, dow:5, year:null };
    return { hasSeconds:true, hasYear:true, second:0, minute:1, hour:2, dom:3, month:4, dow:5, year:6 };
  }
  if (parts.length === 5) return { hasSeconds:false, hasYear:false, second:null, minute:0, hour:1, dom:2, month:3, dow:4, year:null };
  if (parts.length === 6 && dialect.awsYear) return { hasSeconds:false, hasYear:true, second:null, minute:0, hour:1, dom:2, month:3, dow:4, year:5 };
  if (parts.length === 6) return { hasSeconds:true, hasYear:false, second:0, minute:1, hour:2, dom:3, month:4, dow:5, year:null };
  if (parts.length === 7) return { hasSeconds:true, hasYear:true, second:0, minute:1, hour:2, dom:3, month:4, dow:5, year:6 };
  return null;
}

function parseCron(expr, options) {
  const opts = getParseOptions(options);
  const raw = expr.trim();
  // Handle aliases
  if (raw.startsWith("@")) {
    const alias = expandAliasExpression(raw, opts);
    if (alias) return parseCron(alias, opts);
    if (raw.toLowerCase() === "@reboot") return null; // cannot visualize
    return null;
  }
  const cleaned = cleanCronExpression(raw, opts);
  const parts = cleaned.split(/\s+/);
  const layout = determineCronLayout(parts, opts);
  if (!layout) return null;
  const seconds = layout.hasSeconds ? parseCronField(parts[layout.second], 0, 59) : new Set([0]);
  const minutes = parseCronField(parts[layout.minute], 0, 59);
  const hours = parseCronField(parts[layout.hour], 0, 23);
  const domField = parseDayOfMonthField(parts[layout.dom], opts);
  const months = parseCronField(parts[layout.month], 1, 12, MONTH_NAMES);
  const dowField = parseDayOfWeekField(parts[layout.dow], opts);
  const years = layout.hasYear ? parseCronField(parts[layout.year], 1970, 2199) : null;
  if (!seconds || !minutes || !hours || !domField || !months || !dowField || (layout.hasYear && !years)) return null;
  const dialect = getDialectConfig(opts.dialect);
  const domRestricted = !domField.wildcard && !domField.noSpecific;
  const dowRestricted = !dowField.wildcard && !dowField.noSpecific;
  if (dialect.requiresQuestion && ((domRestricted && dowRestricted) || (domField.noSpecific && dowField.noSpecific))) return null;
  if (!dialect.allowQuestion && (domField.noSpecific || dowField.noSpecific)) return null;
  return {
    seconds, minutes, hours, months, years,
    doms:domField.values, dows:dowField.values, domField, dowField,
    domWild:domField.wildcard || domField.noSpecific,
    dowWild:dowField.wildcard || dowField.noSpecific,
    hasSeconds:layout.hasSeconds, hasYear:layout.hasYear,
    fieldCount:parts.length, dialect:opts.dialect, timezone:opts.timezone, dstAware:opts.dstAware,
    dailyCandidates:seconds.size * minutes.size * hours.size,
    raw:cleaned,
  };
}

function isLastDayOfMonth(year, month, day, offset) {
  return day === new Date(year, month, 0).getDate() - (offset || 0);
}

function nearestWeekday(year, month, day) {
  const dim = new Date(year, month, 0).getDate();
  const target = Math.min(day, dim);
  const date = new Date(year, month - 1, target);
  const dow = date.getDay();
  if (dow === 6) return target === 1 ? 3 : target - 1;
  if (dow === 0) return target === dim ? target - 2 : target + 1;
  return target;
}

function lastWeekday(year, month) {
  const dim = new Date(year, month, 0).getDate();
  for (let day = dim; day >= dim - 6; day--) {
    const dow = new Date(year, month - 1, day).getDay();
    if (dow >= 1 && dow <= 5) return day;
  }
  return dim;
}

function lastDowOfMonth(year, month, dow) {
  const dim = new Date(year, month, 0).getDate();
  for (let day = dim; day >= 1; day--) if (new Date(year, month - 1, day).getDay() === dow) return day;
  return null;
}

function nthDowOfMonth(year, month, dow, nth) {
  let count = 0;
  const dim = new Date(year, month, 0).getDate();
  for (let day = 1; day <= dim; day++) {
    if (new Date(year, month - 1, day).getDay() === dow) {
      count++;
      if (count === nth) return day;
    }
  }
  return null;
}

function matchesDomField(field, year, month, day) {
  if (field.wildcard || field.noSpecific) return true;
  if (field.values.has(day)) return true;
  return field.specials.some(s => {
    if (s.type === "lastDay") return isLastDayOfMonth(year, month, day, s.offset);
    if (s.type === "lastWeekday") return day === lastWeekday(year, month);
    if (s.type === "nearestWeekday") return day === nearestWeekday(year, month, s.day);
    return false;
  });
}

function matchesDowField(field, year, month, day) {
  if (field.wildcard || field.noSpecific) return true;
  const dow = new Date(year, month - 1, day).getDay();
  if (field.values.has(dow)) return true;
  return field.specials.some(s => {
    if (s.type === "lastDow") return day === lastDowOfMonth(year, month, s.dow);
    if (s.type === "nthDow") return day === nthDowOfMonth(year, month, s.dow, s.nth);
    return false;
  });
}

function matchesScheduleDate(parsed, year, month, day) {
  const domMatch = matchesDomField(parsed.domField, year, month, day);
  const dowMatch = matchesDowField(parsed.dowField, year, month, day);
  if (parsed.domField.noSpecific) return dowMatch;
  if (parsed.dowField.noSpecific) return domMatch;
  if (parsed.domField.wildcard && parsed.dowField.wildcard) return true;
  if (parsed.domField.wildcard) return dowMatch;
  if (parsed.dowField.wildcard) return domMatch;
  return getDialectConfig(parsed.dialect).requiresQuestion ? domMatch && dowMatch : domMatch || dowMatch;
}

function getTZFormatter(timezone) {
  if (!TZ_FORMATTERS.has(timezone)) {
    TZ_FORMATTERS.set(timezone, new Intl.DateTimeFormat("en-US", {
      timeZone:timezone, year:"numeric", month:"2-digit", day:"2-digit",
      hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false, hourCycle:"h23"
    }));
  }
  return TZ_FORMATTERS.get(timezone);
}

function getTZParts(ts, timezone) {
  const parts = {};
  getTZFormatter(timezone).formatToParts(new Date(ts)).forEach(p => {
    if (p.type !== "literal") parts[p.type] = p.value;
  });
  return {
    year:parseInt(parts.year, 10), month:parseInt(parts.month, 10), day:parseInt(parts.day, 10),
    hour:parseInt(parts.hour, 10) % 24, minute:parseInt(parts.minute, 10), second:parseInt(parts.second, 10)
  };
}

function findZonedInstants(year, monthIndex, day, hour, minute, second, timezone) {
  const key = [timezone, year, monthIndex, day, hour, minute, second].join("|");
  if (ZONED_INSTANT_CACHE.has(key)) return ZONED_INSTANT_CACHE.get(key);
  const approx = Date.UTC(year, monthIndex, day, hour, minute, second);
  const matches = [];
  for (let ts = approx - 14 * 3600000; ts <= approx + 14 * 3600000; ts += 60000) {
    const p = getTZParts(ts, timezone);
    if (p.year === year && p.month === monthIndex + 1 && p.day === day && p.hour === hour && p.minute === minute && p.second === second) matches.push(ts);
  }
  ZONED_INSTANT_CACHE.set(key, matches);
  return matches;
}

function createDisplayDate(instant, year, monthIndex, day, hour, minute, second, duplicated) {
  const date = new Date(instant);
  const dow = new Date(year, monthIndex, day).getDay();
  date.__cronDisplay = { year, monthIndex, day, hour, minute, second, dow, duplicated:!!duplicated };
  date.getFullYear = function(){ return this.__cronDisplay.year; };
  date.getMonth = function(){ return this.__cronDisplay.monthIndex; };
  date.getDate = function(){ return this.__cronDisplay.day; };
  date.getHours = function(){ return this.__cronDisplay.hour; };
  date.getMinutes = function(){ return this.__cronDisplay.minute; };
  date.getSeconds = function(){ return this.__cronDisplay.second; };
  date.getDay = function(){ return this.__cronDisplay.dow; };
  return date;
}

function makeFireDates(parsed, year, monthIndex, day, hour, minute, second) {
  const timezone = parsed.timezone || "local";
  if (timezone === "local" || timezone === LOCAL_TIMEZONE) return [new Date(year, monthIndex, day, hour, minute, second)];
  if (parsed.dstAware && parsed.dailyCandidates <= 240) {
    const instants = findZonedInstants(year, monthIndex, day, hour, minute, second, timezone);
    return instants.map((ts, i) => createDisplayDate(ts, year, monthIndex, day, hour, minute, second, instants.length > 1 && i > 0));
  }
  return [createDisplayDate(Date.UTC(year, monthIndex, day, hour, minute, second), year, monthIndex, day, hour, minute, second, false)];
}

// Estimate total fire count without materializing all dates
function estimateFireCount(parsed, year) {
  if (parsed.years && !parsed.years.has(year)) return 0;
  let count = 0;
  for (const month of parsed.months) {
    const dim = new Date(year, month, 0).getDate();
    for (let day = 1; day <= dim; day++) {
      if (!matchesScheduleDate(parsed, year, month, day)) continue;
      count += parsed.hours.size * parsed.minutes.size * parsed.seconds.size;
    }
  }
  return count;
}

const FIRE_COUNT_CAP = 500000;
const FIRE_TIME_CACHE = new Map();
const FIRE_DATA_CACHE = new Map();

function parsedCacheBaseKey(parsed, year) {
  return [parsed.raw, parsed.dialect, parsed.timezone, parsed.dstAware ? "dst" : "wall", year].join("|");
}

function parsedCacheKey(parsed, year, maxResults) {
  return parsedCacheBaseKey(parsed, year) + "|" + maxResults;
}

function getFireTimes(parsed, year, maxResults = 5000) {
  const key = parsedCacheKey(parsed, year, maxResults);
  if (FIRE_TIME_CACHE.has(key)) return FIRE_TIME_CACHE.get(key);
  const cappedKey = parsedCacheKey(parsed, year, 5000);
  if (maxResults <= 5000 && FIRE_TIME_CACHE.has(cappedKey)) return FIRE_TIME_CACHE.get(cappedKey).slice(0, maxResults);
  const results = [];
  if (parsed.years && !parsed.years.has(year)) {
    FIRE_TIME_CACHE.set(key, results);
    return results;
  }
  for (const month of [...parsed.months].sort((a,b)=>a-b)) {
    const dim = new Date(year, month, 0).getDate();
    for (let day = 1; day <= dim; day++) {
      if (!matchesScheduleDate(parsed, year, month, day)) continue;
      for (const hour of [...parsed.hours].sort((a,b)=>a-b)) {
        for (const minute of [...parsed.minutes].sort((a,b)=>a-b)) {
          for (const second of [...parsed.seconds].sort((a,b)=>a-b)) {
            const dates = makeFireDates(parsed, year, month - 1, day, hour, minute, second);
            for (const date of dates) {
              results.push(date);
              if (results.length >= maxResults) {
                FIRE_TIME_CACHE.set(key, results);
                return results;
              }
            }
          }
        }
      }
    }
  }
  FIRE_TIME_CACHE.set(key, results);
  return results;
}

// All visualizations share this immutable per-expression snapshot. Editing one
// schedule invalidates only its key; unchanged schedules stay hot in cache.
function getScheduleData(parsed, year, maxResults = 5000) {
  const normalizedMax = maxResults === undefined ? 5000 : maxResults;
  const key = parsedCacheKey(parsed, year, normalizedMax);
  if (FIRE_DATA_CACHE.has(key)) return FIRE_DATA_CACHE.get(key);
  const times = getFireTimes(parsed, year, normalizedMax);
  const dayCounts = getDayCounts(times);
  const hourCounts = new Array(24).fill(0);
  const dowCounts = new Array(7).fill(0);
  for (const time of times) {
    hourCounts[time.getHours()]++;
    dowCounts[time.getDay()]++;
  }
  const data = { times, dayCounts, hourCounts, dowCounts };
  FIRE_DATA_CACHE.set(key, data);
  return data;
}

function getCronDisplayParts(expr, options) {
  const opts = getParseOptions(options);
  const raw = expr.trim();
  if (raw.startsWith("@")) {
    const alias = expandAliasExpression(raw, opts);
    if (!alias) return null;
    return getCronDisplayParts(alias, opts);
  }
  const cleaned = cleanCronExpression(raw, opts);
  const parts = cleaned.split(/\s+/);
  const layout = determineCronLayout(parts, opts);
  if (!layout) return null;
  return {
    second:layout.hasSeconds ? parts[layout.second] : "0",
    minute:parts[layout.minute],
    hour:parts[layout.hour],
    dom:parts[layout.dom],
    month:parts[layout.month],
    dow:parts[layout.dow],
    year:layout.hasYear ? parts[layout.year] : "*",
    hasSeconds:layout.hasSeconds,
    hasYear:layout.hasYear,
  };
}

function describeCron(expr, options) {
  const raw = expr.trim();
  // Handle aliases
  if (raw.startsWith("@")) {
    const aliasMap = {"@yearly":"At midnight on January 1st","@annually":"At midnight on January 1st","@monthly":"At midnight on the 1st of every month","@weekly":"At midnight on Sunday","@daily":"At midnight every day","@midnight":"At midnight every day","@hourly":"At the start of every hour","@reboot":"On system reboot (cannot visualize)"};
    const desc = aliasMap[raw.toLowerCase()];
    if (desc) return desc;
    return "Unknown alias: " + raw;
  }
  const display = getCronDisplayParts(expr, options);
  if (!display) return "Invalid expression";
  let { second:minSecond, minute:min, hour:hr, dom, month:mon, dow, year:yr } = display;
  // Resolve named values for display
  mon = resolveNamedValues(mon, MONTH_NAMES);
  dow = dow === "?" ? dow : resolveNamedValues(dow, DOW_NAMES);
  const pieces = [];
  if (display.hasSeconds && minSecond !== "0") {
    if (minSecond === "*") pieces.push("Every second");
    else if (minSecond.startsWith("*/")) pieces.push("Every "+minSecond.slice(2)+" seconds");
    else pieces.push("At second "+minSecond);
  }
  if (min==="*"&&hr==="*") pieces.push("Every minute");
  else if (min.startsWith("*/")) pieces.push("Every "+min.slice(2)+" minutes");
  else if (hr==="*"&&min!=="*") pieces.push("At minute "+min+" of every hour");
  else if (min!=="*"&&hr!=="*") {
    const hrs = hr.includes(",")?hr.split(","):[hr];
    const mins = min.padStart(2,"0");
    if (hrs.length===1&&!hr.includes("-")&&!hr.includes("/")) pieces.push("At "+hr.padStart(2,"0")+":"+mins);
    else pieces.push("At minute "+min+", during hour(s) "+hr);
  } else if (hr.startsWith("*/")) pieces.push("At minute "+(min==="*"?"0":min)+", every "+hr.slice(2)+" hours");
  else pieces.push("At minute "+min+", hour "+hr);
  if (dom!=="*") pieces.push("on day "+dom+" of the month");
  if (mon!=="*") {
    const mNames = mon.split(",").map(m=>{const n=parseInt(m,10);return isNaN(n)?m:(MONTHS[n-1]||m);});
    pieces.push("in "+mNames.join(", "));
  }
  if (dow!=="*") {
    const dMap={"0":"Sun","1":"Mon","2":"Tue","3":"Wed","4":"Thu","5":"Fri","6":"Sat","7":"Sun"};
    const dNames = dow.split(",").map(d=>{
      if(d==="?") return "no specific weekday";
      if(d.includes("#")){const[a,b]=d.split("#");return (dMap[a]||a)+" #"+b;}
      if(d.endsWith("L")){const base=d.slice(0,-1);return (dMap[base]||base||"Sat")+" last-in-month";}
      if(d.includes("-")){const[a,b]=d.split("-");return (dMap[a]||a)+"-"+(dMap[b]||b);}
      return dMap[d]||d;
    });
    pieces.push("on "+dNames.join(", "));
  }
  if (display.hasYear && yr !== "*") pieces.push("in "+yr);
  return pieces.join(" ");
}

// Detailed validation returning per-field errors and suggestions
function validateCronExpr(expr, options) {
  const opts = getParseOptions(options);
  const dialect = getDialectConfig(opts.dialect);
  const raw = expr.trim();
  if (!raw) return { valid: true, fields: [], suggestions: [] };
  // Aliases
  if (raw.startsWith("@")) {
    const lower = raw.toLowerCase();
    if (CRON_ALIASES[lower]) return { valid: true, fields: [], suggestions: [] };
    if (lower === "@reboot") return { valid: false, fields: [], suggestions: ["@reboot cannot be visualized -- it runs only at system boot"] };
    const known = Object.keys(CRON_ALIASES).concat(["@reboot"]);
    const closest = known.filter(a => a.startsWith(lower.slice(0, 3)));
    return { valid: false, fields: [], suggestions: closest.length > 0 ? ["Did you mean: " + closest.join(", ") + "?"] : ["Unknown alias. Known aliases: " + known.join(", ")] };
  }
  const cleaned = cleanCronExpression(raw, opts);
  const parts = cleaned.split(/\s+/);
  const layout = determineCronLayout(parts, opts);
  if (!layout) {
    const suggestions = [];
    const expected = opts.fieldMode === "auto" ? "5, 6, or 7" : opts.fieldMode;
    if (parts.length < 5) suggestions.push("Too few fields (" + parts.length + "). Expected " + expected + " fields for " + dialect.label + ".");
    else suggestions.push("Got " + parts.length + " fields. Expected " + expected + " fields for " + dialect.label + ".");
    if (opts.dialect === "aws") suggestions.push("AWS accepts cron(min hour day-of-month month day-of-week year); cron(...) wrapper is optional.");
    return { valid: false, fields: [], suggestions };
  }
  const fieldDefs = [];
  if (layout.hasSeconds) fieldDefs.push({ index:layout.second, name:"Second", type:"simple", min:0, max:59, nameMap:null });
  fieldDefs.push({ index:layout.minute, name:"Minute", type:"simple", min:0, max:59, nameMap:null });
  fieldDefs.push({ index:layout.hour, name:"Hour", type:"simple", min:0, max:23, nameMap:null });
  fieldDefs.push({ index:layout.dom, name:"Day of Month", type:"dom", min:1, max:31, nameMap:null });
  fieldDefs.push({ index:layout.month, name:"Month", type:"simple", min:1, max:12, nameMap:MONTH_NAMES });
  fieldDefs.push({ index:layout.dow, name:"Day of Week", type:"dow", min:0, max:7, nameMap:DOW_NAMES });
  if (layout.hasYear) fieldDefs.push({ index:layout.year, name:"Year", type:"simple", min:1970, max:2199, nameMap:null });
  const fields = [];
  const suggestions = [];
  let allValid = true;
  fieldDefs.forEach((def, i) => {
    const part = parts[def.index];
    const result = def.type === "dom" ? parseDayOfMonthField(part, opts) : def.type === "dow" ? parseDayOfWeekField(part, opts) : parseCronField(part, def.min, def.max, def.nameMap);
    if (result === null) {
      allValid = false;
      fields.push({ index: def.index, name: def.name, value: part, error: true });
      // Generate specific suggestions
      if (def.nameMap) {
        const resolvedField = resolveNamedValues(part, def.nameMap);
        if (/[A-Za-z]/.test(resolvedField)) {
          const validNames = Object.keys(def.nameMap).join(", ");
          suggestions.push(def.name + ": unrecognized name in '" + part + "'. Valid names: " + validNames);
        } else {
          suggestions.push(def.name + ": value out of range (" + def.min + "-" + def.max + ") in '" + part + "'");
        }
      } else {
        suggestions.push(def.name + ": invalid value '" + part + "' (range: " + def.min + "-" + def.max + ")");
      }
    } else {
      fields.push({ index: def.index, name: def.name, value: part, error: false });
    }
  });
  const parsed = allValid ? parseCron(raw, opts) : null;
  if (allValid && !parsed) {
    allValid = false;
    if (dialect.requiresQuestion) suggestions.push(dialect.label + " requires either day-of-month or day-of-week to be '?' when the other is restricted.");
    else suggestions.push("Expression is not valid for the selected dialect.");
  }
  return { valid: allValid, fields, suggestions };
}

function getDayCounts(fireTimes) {
  const counts = {};
  for (const t of fireTimes) { const k=t.getMonth()+"-"+t.getDate(); counts[k]=(counts[k]||0)+1; }
  return counts;
}

function formatRunTime(t) {
  const base = String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
  const sec = t.getSeconds && t.getSeconds() ? ":"+String(t.getSeconds()).padStart(2,"0") : "";
  return base + sec + (t.__cronDisplay && t.__cronDisplay.duplicated ? " DST+" : "");
}

function buildDayAggregation(expressions, year) {
  const allData = expressions.filter(e=>e.parsed).map((e,i)=>({
    counts:getScheduleData(e.parsed,year).dayCounts, color:EC[i%EC.length], label:e.label || e.value
  }));
  let max = 0;
  for (const data of allData) for (const v of Object.values(data.counts)) if (v > max) max = v;
  return { allData, max };
}

function aggregateDay(aggregation, monthIndex, day, fallbackColor) {
  const key = monthIndex+"-"+day;

  aggregation.allData.forEach(data => {
    const count = data.counts[key] || 0;
    total += count;
    if (count > best.count) best = { count, color:data.color };
  });
  return { total, color:best.color || fallbackColor };
}

// --- URL state helpers ---
function encodeURLState(expressions, year) {
  const params = new URLSearchParams();
  expressions.forEach((e, i) => {
    if (e.value.trim()) {
      params.set("expr" + (i > 0 ? i : ""), e.value);
      if (e.label.trim()) params.set("label" + (i > 0 ? i : ""), e.label);
    }
  });
  params.set("year", String(year));
  return params.toString();
}

function encodeAppState(expressions, year, options) {
  const params = new URLSearchParams(encodeURLState(expressions, year));
  const opts = getParseOptions(options);
  if (opts.dialect !== DEFAULT_PARSE_OPTIONS.dialect) params.set("dialect", opts.dialect);
  if (opts.fieldMode !== DEFAULT_PARSE_OPTIONS.fieldMode) params.set("mode", opts.fieldMode);
  if (opts.timezone !== DEFAULT_PARSE_OPTIONS.timezone) params.set("tz", opts.timezone);
  if (opts.dstAware) params.set("dst", "1");
  return params.toString();
}

function decodeURLState() {
  const params = new URLSearchParams(window.location.search);
  const exprs = [];
  // Check expr, expr1, expr2, ... up to 20
  for (let i = 0; i < 20; i++) {
    const key = i === 0 ? "expr" : "expr" + i;
    const val = params.get(key);
    if (val !== null) {
      const labelKey = i === 0 ? "label" : "label" + i;
      exprs.push({ value: val, label: params.get(labelKey) || "" });
    }
  }
  const year = params.has("year") ? parseInt(params.get("year"), 10) : null;
  const dialect = DIALECTS[params.get("dialect")] ? params.get("dialect") : DEFAULT_PARSE_OPTIONS.dialect;
  const mode = FIELD_MODE_LABELS[params.get("mode")] ? params.get("mode") : DEFAULT_PARSE_OPTIONS.fieldMode;
  const timezone = params.get("tz") || DEFAULT_PARSE_OPTIONS.timezone;
  const dstAware = params.get("dst") === "1";
  return { exprs: exprs.length > 0 ? exprs : null, year: year && !isNaN(year) ? year : null, dialect, mode, timezone, dstAware };
}

// Keep keyboard users inside an open dialog and return focus to the opener.
function useModalFocus(open, onClose) {
  const dialogRef = useRef(null);
  const closeRef = useRef(onClose);
  closeRef.current = onClose;

  useEffect(() => {
    if (!open) return undefined;
    const dialog = dialogRef.current;
    const previous = document.activeElement;
    const getFocusable = () => dialog ? Array.from(dialog.querySelectorAll(
      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
    )).filter(element => !element.disabled && element.getAttribute("aria-hidden") !== "true") : [];
    const focusFirst = () => {
      const focusable = getFocusable();
      (focusable[0] || dialog)?.focus();
    };
    const focusFrame = typeof requestAnimationFrame === "function"
      ? requestAnimationFrame(focusFirst)
      : setTimeout(focusFirst, 0);
    const onKeyDown = event => {
      if (event.key === "Escape") {
        event.preventDefault();
        closeRef.current();
        return;
      }
      if (event.key !== "Tab") return;
      const focusable = getFocusable();
      if (focusable.length === 0) {
        event.preventDefault();
        dialog?.focus();
        return;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    };
    dialog?.addEventListener("keydown", onKeyDown);
    return () => {
      if (typeof cancelAnimationFrame === "function") cancelAnimationFrame(focusFrame);
      else clearTimeout(focusFrame);
      dialog?.removeEventListener("keydown", onKeyDown);
      if (previous && typeof previous.focus === "function") previous.focus();
    };
  }, [open]);

  return dialogRef;
}

// --- Crontab import parser ---
function parseCrontabLines(text) {
  return text.split("\n")
    .map(l => l.trim())
    .filter(l => l && !l.startsWith("#"))
    .map(line => {
      // Handle aliases
      if (line.startsWith("@")) {
        const parts = line.split(/\s+/);
        const alias = parts[0];
        const cmd = parts.slice(1).join(" ");
        return { value: alias, label: cmd ? cmd.split("/").pop().split(" ")[0] : alias };
      }
      const parts = line.split(/\s+/);
      if (parts.length >= 5) {
        const expr = parts.slice(0, 5).join(" ");
        const cmd = parts.slice(5).join(" ");
        const label = cmd ? cmd.split("/").pop().split(" ")[0] : "";
        return { value: expr, label: label || expr };
      }
      return null;
    })
    .filter(Boolean);
}

function parseYamlScalar(value) {
  const text = value.trim();
  if (!text) return "";
  const quote = text[0];
  if (quote === '"' || quote === "'") {
    const end = text.lastIndexOf(quote);
    if (end > 0) {
      const inner = text.slice(1, end);
      return quote === '"' ? inner.replace(/\\(["\\nrt])/g, (_, code) => ({'"':'"','\\':'\\','n':'\n','r':'\r','t':'\t'}[code])) : inner.replace(/''/g, "'");
    }
  }
  return text.replace(/\s+#.*$/, "").trim();
}

function parseKubernetesCronJobs(text) {
  const found = [];
  const docs = text.split(/^---\s*$/m);
  docs.forEach((doc, idx) => {
    const lines = doc.split(/\r?\n/);
    const scheduleLine = lines.find(line => /^\s*schedule\s*:/.test(line));
    if (!scheduleLine) return;
    const schedule = parseYamlScalar(scheduleLine.replace(/^\s*schedule\s*:/, ""));
    if (!schedule) return;
    const metadataIndex = lines.findIndex(line => /^\s*metadata\s*:\s*(?:#.*)?$/.test(line));
    const metadataIndent = metadataIndex >= 0 ? (lines[metadataIndex].match(/^\s*/)[0].length) : -1;
    const nameLine = metadataIndex >= 0
      ? lines.slice(metadataIndex + 1).find(line => {
        const indent = line.match(/^\s*/)[0].length;
        return indent > metadataIndent && /^\s*name\s*:/.test(line);
      })
      : lines.find(line => /^\s*name\s*:/.test(line));
    const name = nameLine ? parseYamlScalar(nameLine.replace(/^\s*name\s*:/, "")) : "";
    found.push({ value:schedule, label:name || "CronJob "+(idx+1) });
  });
  return found;
}

function parseImportText(text) {
  const yaml = parseKubernetesCronJobs(text);
  const crontab = parseCrontabLines(text);
  const byKey = new Map();
  [...yaml, ...crontab].forEach(item => byKey.set(item.value+"|"+item.label, item));
  return [...byKey.values()];
}

// --- Markdown report generator ---
function generateMarkdownReport(expressions, year, options) {
  const lines = [];
  lines.push("# CronScope Schedule Report");
  lines.push("");
  lines.push("**Year:** " + year);
  lines.push("**Dialect:** " + getDialectConfig(getParseOptions(options).dialect).label);
  lines.push("**Timezone:** " + (getParseOptions(options).timezone === "local" ? LOCAL_TIMEZONE + " (local)" : getParseOptions(options).timezone));
  lines.push("**Generated:** " + new Date().toISOString().slice(0, 10));
  lines.push("");
  const valid = expressions.filter(e => e.parsed);
  if (valid.length === 0) { lines.push("No valid expressions."); return lines.join("\n"); }
  lines.push("## Expressions");
  lines.push("");
  lines.push("| # | Label | Expression | Description |");
  lines.push("|---|-------|------------|-------------|");
  valid.forEach((e, i) => {
    lines.push("| " + (i + 1) + " | " + (e.label || "-") + " | `" + e.value + "` | " + describeCron(e.value, options) + " |");
  });
  lines.push("");
  lines.push("## Statistics");
  lines.push("");
  lines.push("| Label | Runs/Year | Active Days | Max/Day | Avg/Active Day | Peak Hour | Peak Day |");
  lines.push("|-------|-----------|-------------|---------|----------------|-----------|----------|");
  valid.forEach((e, i) => {
    const times = getFireTimes(e.parsed, year);
    const dayCounts = getDayCounts(times);
    const activeDays = Object.keys(dayCounts).length;
    const maxPerDay = Math.max(0, ...Object.values(dayCounts));
    const hourDist = new Array(24).fill(0); const dowDist = new Array(7).fill(0);
    for (const t of times) { hourDist[t.getHours()]++; dowDist[t.getDay()]++; }
    const peakHour = hourDist.indexOf(Math.max(...hourDist));
    const peakDow = dowDist.indexOf(Math.max(...dowDist));
    const avg = activeDays > 0 ? (times.length / activeDays).toFixed(1) : "0";
    lines.push("| " + (e.label || e.value) + " | " + times.length.toLocaleString() + " | " + activeDays + " | " + maxPerDay + " | " + avg + " | " + String(peakHour).padStart(2, "0") + ":00 | " + DAYS[peakDow] + " |");
  });
  // Conflicts
  if (valid.length >= 2) {
    const conflicts = [];
    for (let i = 0; i < valid.length; i++) {
      for (let j = i + 1; j < valid.length; j++) {
        const setA = new Set(getFireTimes(valid[i].parsed, year, 2000).map(t => t.getTime()));
        const timesB = getFireTimes(valid[j].parsed, year, 2000);
        let overlap = 0; for (const t of timesB) if (setA.has(t.getTime())) overlap++;
        if (overlap > 0) conflicts.push({ a: valid[i].label || valid[i].value, b: valid[j].label || valid[j].value, overlap });
      }
    }
    if (conflicts.length > 0) {
      lines.push("");
      lines.push("## Conflicts");
      lines.push("");
      conflicts.forEach(c => {
        lines.push("- **" + c.a + "** overlaps with **" + c.b + "** -- " + c.overlap.toLocaleString() + " shared execution(s)");
      });
    }
  }
  lines.push("");
  lines.push("---");
  lines.push("*Generated by [CronScope](https://sysadmindoc.github.io/CronScope/)*");
  return lines.join("\n");
}

function escapeXml(value) {
  return String(value).replace(/[&<>"']/g, character => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&apos;"}[character]));
}

function buildHeatmapSvg(expressions, year, mode, month, day, C) {
  const aggregation = buildDayAggregation(expressions, year);
  const cell = mode === "year" ? 10 : 20;
  const gap = 2;
  const left = 50;
  const top = 34;
  const width = mode === "year" ? 760 : 560;
  const height = mode === "year" ? 400 : 320;
  const parts = [];
  parts.push('<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'" viewBox="0 0 '+width+' '+height+'">');
  parts.push('<rect width="100%" height="100%" fill="'+C.bg+'"/>');
  parts.push('<text x="20" y="22" fill="'+C.text+'" font-family="Inter, Arial" font-size="16" font-weight="700">CronScope '+year+' '+mode+' export</text>');
  const validExpressions = expressions.filter(e => e.parsed);
  const legendX = mode === "year" ? 540 : 310;
  parts.push('<text x="'+legendX+'" y="42" fill="'+C.textDim+'" font-family="Inter, Arial" font-size="11" font-weight="700">Legend</text>');
  validExpressions.slice(0, 8).forEach((expression, index) => {
    const color = EC[expressions.indexOf(expression) % EC.length];
    const legendY = 56 + index * 16;
    parts.push('<rect x="'+legendX+'" y="'+(legendY-9)+'" width="9" height="9" rx="2" fill="'+color+'"/>');
    parts.push('<text x="'+(legendX+15)+'" y="'+legendY+'" fill="'+C.text+'" font-family="Inter, Arial" font-size="9">'+escapeXml(expression.label || expression.value)+'</text>');
  });
  if (validExpressions.length > 8) {
    parts.push('<text x="'+legendX+'" y="'+(56 + 8 * 16)+'" fill="'+C.textMuted+'" font-family="Inter, Arial" font-size="9">+'+(validExpressions.length-8)+' more</text>');
  }
  const drawCell = (x,y,count,color,label) => {
    const opacity = count===0?0:Math.max(0.15,Math.min(1,count/Math.max(aggregation.max,1)));
    const fill = count===0 ? "transparent" : color + Math.round(opacity*220).toString(16).padStart(2,"0");
    parts.push('<rect x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+'" rx="2" fill="'+fill+'" stroke="'+(count?color:C.border)+'" stroke-opacity="0.35"/>');
    if (label && cell >= 18) parts.push('<text x="'+(x+cell/2)+'" y="'+(y+cell/2+3)+'" fill="'+C.text+'" font-family="JetBrains Mono, monospace" font-size="8" text-anchor="middle">'+label+'</text>');
  };
  if (mode === "month" || mode === "week" || mode === "day") {
    const targetMonth = month || 0;
    const dim = new Date(year, targetMonth+1, 0).getDate();
    const firstDow = new Date(year, targetMonth, 1).getDay();
    for (let d = 1; d <= dim; d++) {
      const idx = firstDow + d - 1;
      const x = left + (idx % 7) * (cell + gap);
      const y = top + Math.floor(idx / 7) * (cell + gap);
      const data = aggregateDay(aggregation, targetMonth, d, C.accent);
      drawCell(x,y,data.total,data.color,String(d));
    }
  } else {
    MONTHS.forEach((mName,mIdx)=>{
      const rowTop = top + mIdx * 26;
      parts.push('<text x="15" y="'+(rowTop+9)+'" fill="'+C.textMuted+'" font-family="JetBrains Mono, monospace" font-size="10">'+mName+'</text>');
      const dim = new Date(year,mIdx+1,0).getDate();
      const firstDow = new Date(year,mIdx,1).getDay();
      for (let d=1; d<=dim; d++) {
        const idx = firstDow + d - 1;
        const x = left + Math.floor(idx/7) * (cell + gap);
        const y = rowTop + (idx % 7) * (cell + gap);
        const data = aggregateDay(aggregation,mIdx,d,C.accent);
        drawCell(x,y,data.total,data.color,"");
      }
    });
  }
  parts.push('</svg>');
  return parts.join("");
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportSvg(expressions, year, mode, month, day, C) {
  const svg = buildHeatmapSvg(expressions, year, mode, month, day, C);
  downloadBlob(new Blob([svg], { type:"image/svg+xml" }), "cronscope-"+year+"-"+mode+".svg");
}

function exportPng(expressions, year, mode, month, day, C, done) {
  const svg = buildHeatmapSvg(expressions, year, mode, month, day, C);
  const img = new Image();
  const url = URL.createObjectURL(new Blob([svg], { type:"image/svg+xml" }));
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(blob => {
      if (blob) downloadBlob(blob, "cronscope-"+year+"-"+mode+".png");
      URL.revokeObjectURL(url);
      done && done();
    }, "image/png", 0.95);
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    done && done(new Error("Unable to render SVG export"));
  };
  img.src = url;
}

function timestampMatches(parsed, date) {
  if (!parsed) return { matches:false, reasons:["Expression is invalid."] };
  const y = date.getFullYear(), month = date.getMonth()+1, day = date.getDate();
  const reasons = [];
  if (parsed.years && !parsed.years.has(y)) reasons.push("Year "+y+" is not selected.");
  if (!parsed.months.has(month)) reasons.push("Month "+month+" is not selected.");
  if (!matchesScheduleDate(parsed, y, month, day)) reasons.push("Day "+day+" / "+DAYS[date.getDay()]+" does not match day fields.");
  if (!parsed.hours.has(date.getHours())) reasons.push("Hour "+date.getHours()+" is not selected.");
  if (!parsed.minutes.has(date.getMinutes())) reasons.push("Minute "+date.getMinutes()+" is not selected.");
  if (!parsed.seconds.has(date.getSeconds())) reasons.push("Second "+date.getSeconds()+" is not selected.");
  return { matches:reasons.length===0, reasons };
}

function findNeighborRun(parsed, pivot, direction) {
  if (!parsed) return null;
  const years = direction > 0 ? [pivot.getFullYear(), pivot.getFullYear()+1] : [pivot.getFullYear(), pivot.getFullYear()-1];
  const all = years.flatMap(y=>getFireTimes(parsed, y, 20000)).sort((a,b)=>a-b);
  if (direction > 0) return all.find(t=>t>pivot) || null;
  for (let i=all.length-1; i>=0; i--) if (all[i] < pivot) return all[i];
  return null;
}

function WhyDebugger({expressions,debugExpressionId,setDebugExpressionId,debugTimestamp,setDebugTimestamp,C}) {
  const valid = expressions.filter(e=>e.parsed);
  if (valid.length === 0) return null;
  const selected = valid.find(e=>String(e.id)===String(debugExpressionId)) || valid[0];
  const pivot = debugTimestamp ? new Date(debugTimestamp) : new Date();
  const result = isNaN(pivot.getTime()) ? { matches:false, reasons:["Enter a valid timestamp."] } : timestampMatches(selected.parsed, pivot);
  const prev = isNaN(pivot.getTime()) ? null : findNeighborRun(selected.parsed, pivot, -1);
  const next = isNaN(pivot.getTime()) ? null : findNeighborRun(selected.parsed, pivot, 1);
  return React.createElement("div",{style:{background:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:14}},
    React.createElement("div",{style:{fontSize:11,fontWeight:600,color:C.textDim,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}},"Why Didn't It Fire?"),
    React.createElement("select",{value:selected.id,onChange:ev=>setDebugExpressionId(ev.target.value),"aria-label":"Expression to debug",
      style:{width:"100%",background:C.surfaceAlt,border:"1px solid "+C.border,borderRadius:8,padding:"7px 8px",color:C.text,fontSize:11,marginBottom:8}},
      valid.map(e=>React.createElement("option",{key:e.id,value:e.id},e.label||e.value))
    ),
    React.createElement("input",{type:"datetime-local",value:debugTimestamp,onChange:ev=>setDebugTimestamp(ev.target.value),"aria-label":"Timestamp to debug",
      style:{width:"100%",background:C.surfaceAlt,border:"1px solid "+C.border,borderRadius:8,padding:"7px 8px",color:C.text,fontSize:11,marginBottom:8}}),
    React.createElement("div",{style:{fontSize:11,color:result.matches?C.green:C.orange,lineHeight:1.5,marginBottom:6}},
      result.matches ? "This timestamp matches." : result.reasons.join(" ")
    ),

      React.createElement("div",null,"Next: ",next?MONTHS[next.getMonth()]+" "+next.getDate()+" "+formatRunTime(next):"--")
    )
  );
}

          nextRuns.length>0?React.createElement("div",{style:{background:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:14}},
            React.createElement("div",{style:{fontSize:11,fontWeight:600,color:C.textDim,marginBottom:8,textTransform:"uppercase",letterSpacing:"0.05em"}},"Next 15 Runs"),
            React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:3}},
              nextRuns.map((r,i)=>React.createElement("div",{key:i,style:{fontSize:11,display:"flex",alignItems:"center",gap:6,padding:"3px 0",fontFamily:"'JetBrains Mono',monospace",color:C.textDim}},
                React.createElement("span",{style:{width:5,height:5,borderRadius:"50%",background:r.color,flexShrink:0},"aria-hidden":"true"}),
                React.createElement("span",{style:{color:C.text}},MONTHS[r.time.getMonth()]+" "+r.time.getDate()),
                React.createElement("span",null,formatRunTime(r.time)),
                React.createElement("span",{style:{fontSize:9,color:C.textMuted,marginLeft:"auto"}},DAYS[r.time.getDay()])
              ))
            )
          ):null,

          // Stats
          React.createElement(StatsPanel,{expressions,year,C}),

          React.createElement(WhyDebugger,{expressions,debugExpressionId,setDebugExpressionId,debugTimestamp,setDebugTimestamp,C}),

          // Export report button
          React.createElement("button",{onClick:handleExportReport,
            style:{background:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:"10px 14px",color:copyFeedback&&copyFeedback.type==="export"?C.green:C.textDim,fontSize:12,cursor:"pointer",transition:"all 0.15s",display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontFamily:"'JetBrains Mono',monospace"},
            onMouseEnter:ev=>{ev.currentTarget.style.borderColor=C.accent;ev.currentTarget.style.color=C.accent;},
            onMouseLeave:ev=>{if(!copyFeedback||copyFeedback.type!=="export"){ev.currentTarget.style.borderColor=C.border;ev.currentTarget.style.color=C.textDim;}}},
            React.createElement("svg",{width:14,height:14,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,"aria-hidden":"true"},
              React.createElement("path",{d:"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"}),
              React.createElement("polyline",{points:"14 2 14 8 20 8"}),
              React.createElement("line",{x1:16,y1:13,x2:8,y2:13}),
              React.createElement("line",{x1:16,y1:17,x2:8,y2:17}),
              React.createElement("polyline",{points:"10 9 9 9 8 9"})
            ),
            copyFeedback&&copyFeedback.type==="export"?"Report Copied!":"Export Markdown Report"
          ),
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
            React.createElement("button",{onClick:handleExportSvg,
              style:{background:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:"10px 12px",color:copyFeedback&&copyFeedback.type==="svg"?C.green:C.textDim,fontSize:12,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace"}},
              copyFeedback&&copyFeedback.type==="svg"?"SVG Saved":"Export SVG"
            ),
            React.createElement("button",{onClick:handleExportPng,
              style:{background:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:"10px 12px",color:copyFeedback&&copyFeedback.type==="png"?C.green:copyFeedback&&copyFeedback.type==="png-error"?C.error:C.textDim,fontSize:12,cursor:"pointer",fontFamily:"'JetBrains Mono',monospace"}},
              copyFeedback&&copyFeedback.type==="png"?"PNG Saved":copyFeedback&&copyFeedback.type==="png-error"?"PNG Failed":"Export PNG"
            )
          )
        )
      )
    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
