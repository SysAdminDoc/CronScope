<body class="theme-dark">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const FIELD_NAMES = ["Minute","Hour","Day of Month","Month","Day of Week"];
const PRESETS = [
  { label: "Every minute", expr: "* * * * *" },
  { label: "Every 5 minutes", expr: "*/5 * * * *" },
  { label: "Every hour", expr: "0 * * * *" },
  { label: "Every 6 hours", expr: "0 */6 * * *" },
  { label: "Daily at midnight", expr: "0 0 * * *" },
  { label: "Daily at 9 AM", expr: "0 9 * * *" },
  { label: "Weekdays at 9 AM", expr: "0 9 * * 1-5" },
  { label: "Weekly Sunday midnight", expr: "0 0 * * 0" },
  { label: "1st of month at noon", expr: "0 12 1 * *" },
  { label: "Every 15 min, work hours", expr: "*/15 9-17 * * 1-5" },
  { label: "Quarterly (Jan/Apr/Jul/Oct)", expr: "0 0 1 1,4,7,10 *" },
  { label: "Yearly Jan 1 midnight", expr: "0 0 1 1 *" },
];

// Named value maps for cron month and day-of-week fields
const MONTH_NAMES = {JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
const DOW_NAMES = {SUN:0,MON:1,TUE:2,WED:3,THU:4,FRI:5,SAT:6};

// Cron aliases
const CRON_ALIASES = {
  "@yearly": "0 0 1 1 *", "@annually": "0 0 1 1 *",
  "@monthly": "0 0 1 * *", "@weekly": "0 0 * * 0",
  "@daily": "0 0 * * *", "@midnight": "0 0 * * *",
  "@hourly": "0 * * * *",
};

// Theme definitions
const THEMES = {
  dark: {
    bg: "#0a0e17", surface: "#111827", surfaceAlt: "#151d2e",
    border: "#1e293b", borderHover: "#334155",
    text: "#e2e8f0", textDim: "#64748b", textMuted: "#475569",
    accent: "#06b6d4", accentDim: "#0e7490", accentGlow: "rgba(6,182,212,0.15)",
    error: "#f43f5e", errorDim: "rgba(244,63,94,0.15)",
    green: "#10b981", orange: "#f59e0b", purple: "#a78bfa",
    modalOverlay: "rgba(0,0,0,0.6)",
  },
  light: {
    bg: "#f8fafc", surface: "#ffffff", surfaceAlt: "#f1f5f9",
    border: "#e2e8f0", borderHover: "#cbd5e1",
    text: "#1e293b", textDim: "#64748b", textMuted: "#94a3b8",
    accent: "#0891b2", accentDim: "#06b6d4", accentGlow: "rgba(8,145,178,0.1)",
    error: "#e11d48", errorDim: "rgba(225,29,72,0.1)",
    green: "#059669", orange: "#d97706", purple: "#7c3aed",
    modalOverlay: "rgba(0,0,0,0.3)",
  },
};
const EC = ["#06b6d4","#f59e0b","#a78bfa","#f43f5e","#10b981","#fb923c"];

// Replace named month/day tokens with numeric equivalents
function resolveNamedValues(field, nameMap) {
  return field.replace(/[A-Za-z]+/g, token => {
    const up = token.toUpperCase();
    return nameMap[up] !== undefined ? String(nameMap[up]) : token;
  });
}

function parseCronField(field, min, max, nameMap) {
  if (nameMap) field = resolveNamedValues(field, nameMap);
  const values = new Set();
  for (const part of field.split(",")) {
    if (part === "*") { for (let i = min; i <= max; i++) values.add(i); }
    else if (part.includes("/")) {
      const [range, stepStr] = part.split("/");
      const step = parseInt(stepStr, 10);
      if (isNaN(step) || step <= 0) return null;
      let start = min, end = max;
      if (range !== "*") {
        if (range.includes("-")) { const [a, b] = range.split("-").map(Number); start = a; end = b; }
        else start = parseInt(range, 10);
      }
      if (isNaN(start) || isNaN(end)) return null;
      for (let i = start; i <= end; i += step) values.add(i);
    } else if (part.includes("-")) {
      const [a, b] = part.split("-").map(Number);
      if (isNaN(a) || isNaN(b)) return null;
      for (let i = a; i <= b; i++) values.add(i);
    } else {
      const v = parseInt(part, 10);
      if (isNaN(v)) return null;
      values.add(v);
    }
  }
  for (const v of values) if (v < min || v > max) return null;
  return values;
}

function parseCron(expr) {
  const raw = expr.trim();
  // Handle aliases
  if (raw.startsWith("@")) {
    const alias = CRON_ALIASES[raw.toLowerCase()];
    if (alias) return parseCron(alias);
    if (raw.toLowerCase() === "@reboot") return null; // cannot visualize
    return null;
  }
  const parts = raw.split(/\s+/);
  if (parts.length !== 5) return null;
  const minutes = parseCronField(parts[0], 0, 59);
  const hours = parseCronField(parts[1], 0, 23);
  const doms = parseCronField(parts[2], 1, 31);
  const months = parseCronField(parts[3], 1, 12, MONTH_NAMES);
  let dows = parseCronField(parts[4], 0, 7, DOW_NAMES);
  if (!minutes || !hours || !doms || !months || !dows) return null;
  if (dows.has(7)) { dows.add(0); dows.delete(7); }
  return { minutes, hours, doms, months, dows, domWild: parts[2] === "*", dowWild: parts[4] === "*" };
}

// Estimate total fire count without materializing all dates
function estimateFireCount(parsed, year) {
  const { minutes, hours, doms, months, dows, domWild, dowWild } = parsed;
  let count = 0;
  for (const month of months) {
    const dim = new Date(year, month, 0).getDate();
    for (let day = 1; day <= dim; day++) {
      if (!doms.has(day)) continue;
      const date = new Date(year, month-1, day);
      const dow = date.getDay();
      if (!domWild && !dowWild) { if (!doms.has(day) && !dows.has(dow)) continue; }
      else if (!dowWild) { if (!dows.has(dow)) continue; }
      count += hours.size * minutes.size;
    }
  }
  return count;
}

const FIRE_COUNT_CAP = 500000;

function getFireTimes(parsed, year, maxResults = 5000) {
  const results = [];
  const { minutes, hours, doms, months, dows, domWild, dowWild } = parsed;
  for (const month of [...months].sort((a,b)=>a-b)) {
    const dim = new Date(year, month, 0).getDate();
    for (let day = 1; day <= dim; day++) {
      if (!doms.has(day)) continue;
      const date = new Date(year, month-1, day);
      const dow = date.getDay();
      if (!domWild && !dowWild) { if (!doms.has(day) && !dows.has(dow)) continue; }
      else if (!dowWild) { if (!dows.has(dow)) continue; }
      for (const hour of [...hours].sort((a,b)=>a-b)) {
        for (const minute of [...minutes].sort((a,b)=>a-b)) {
          results.push(new Date(year, month-1, day, hour, minute));
          if (results.length >= maxResults) return results;
        }
      }
    }
  }
  return results;
}

function describeCron(expr) {
  const raw = expr.trim();
  // Handle aliases
  if (raw.startsWith("@")) {
    const aliasMap = {"@yearly":"At midnight on January 1st","@annually":"At midnight on January 1st","@monthly":"At midnight on the 1st of every month","@weekly":"At midnight on Sunday","@daily":"At midnight every day","@midnight":"At midnight every day","@hourly":"At the start of every hour","@reboot":"On system reboot (cannot visualize)"};
    const desc = aliasMap[raw.toLowerCase()];
    if (desc) return desc;
    return "Unknown alias: " + raw;
  }
  const parts = raw.split(/\s+/);
  if (parts.length !== 5) return "Invalid expression";
  let [min,hr,dom,mon,dow] = parts;
  // Resolve named values for display
  mon = resolveNamedValues(mon, MONTH_NAMES);
  dow = resolveNamedValues(dow, DOW_NAMES);
  const pieces = [];
  if (min==="*"&&hr==="*") pieces.push("Every minute");
  else if (min.startsWith("*/")) pieces.push("Every "+min.slice(2)+" minutes");
  else if (hr==="*"&&min!=="*") pieces.push("At minute "+min+" of every hour");
  else if (min!=="*"&&hr!=="*") {
    const hrs = hr.includes(",")?hr.split(","):[hr];
    const mins = min.padStart(2,"0");
    if (hrs.length===1&&!hr.includes("-")&&!hr.includes("/")) pieces.push("At "+hr.padStart(2,"0")+":"+mins);
    else pieces.push("At minute "+min+", during hour(s) "+hr);
  } else if (hr.startsWith("*/")) pieces.push("At minute "+(min==="*"?"0":min)+", every "+hr.slice(2)+" hours");
  else pieces.push("At minute "+min+", hour "+hr);
  if (dom!=="*") pieces.push("on day "+dom+" of the month");
  if (mon!=="*") {
    const mNames = mon.split(",").map(m=>{const n=parseInt(m,10);return isNaN(n)?m:(MONTHS[n-1]||m);});
    pieces.push("in "+mNames.join(", "));
  }
  if (dow!=="*") {
    const dMap={"0":"Sun","1":"Mon","2":"Tue","3":"Wed","4":"Thu","5":"Fri","6":"Sat","7":"Sun"};
    const dNames = dow.split(",").map(d=>{
      if(d.includes("-")){const[a,b]=d.split("-");return (dMap[a]||a)+"-"+(dMap[b]||b);}
      return dMap[d]||d;
    });
    pieces.push("on "+dNames.join(", "));
  }
  return pieces.join(" ");
}

// Detailed validation returning per-field errors and suggestions
function validateCronExpr(expr) {
  const raw = expr.trim();
  if (!raw) return { valid: true, fields: [], suggestions: [] };
  // Aliases
  if (raw.startsWith("@")) {
    const lower = raw.toLowerCase();
    if (CRON_ALIASES[lower]) return { valid: true, fields: [], suggestions: [] };
    if (lower === "@reboot") return { valid: false, fields: [], suggestions: ["@reboot cannot be visualized -- it runs only at system boot"] };
    const known = Object.keys(CRON_ALIASES).concat(["@reboot"]);
    const closest = known.filter(a => a.startsWith(lower.slice(0, 3)));
    return { valid: false, fields: [], suggestions: closest.length > 0 ? ["Did you mean: " + closest.join(", ") + "?"] : ["Unknown alias. Known aliases: " + known.join(", ")] };
  }
  const parts = raw.split(/\s+/);
  if (parts.length !== 5) {
    const suggestions = [];
    if (parts.length < 5) suggestions.push("Too few fields (" + parts.length + "/5). Format: minute hour day-of-month month day-of-week");
    if (parts.length > 5 && parts.length <= 7) suggestions.push("Got " + parts.length + " fields. CronScope supports standard 5-field cron (6/7-field Quartz mode coming soon)");
    if (parts.length > 7) suggestions.push("Too many fields (" + parts.length + "/5). Format: minute hour day-of-month month day-of-week");
    return { valid: false, fields: [], suggestions };
  }
  const fieldDefs = [
    { name: "Minute", min: 0, max: 59, nameMap: null },
    { name: "Hour", min: 0, max: 23, nameMap: null },
    { name: "Day of Month", min: 1, max: 31, nameMap: null },
    { name: "Month", min: 1, max: 12, nameMap: MONTH_NAMES },
    { name: "Day of Week", min: 0, max: 7, nameMap: DOW_NAMES },
  ];
  const fields = [];
  const suggestions = [];
  let allValid = true;
  parts.forEach((part, i) => {
    const def = fieldDefs[i];
    const result = parseCronField(part, def.min, def.max, def.nameMap);
    if (result === null) {
      allValid = false;
      fields.push({ index: i, name: def.name, value: part, error: true });
      // Generate specific suggestions
      if (def.nameMap) {
        const resolvedField = resolveNamedValues(part, def.nameMap);
        if (/[A-Za-z]/.test(resolvedField)) {
          const validNames = Object.keys(def.nameMap).join(", ");
          suggestions.push(def.name + ": unrecognized name in '" + part + "'. Valid names: " + validNames);
        } else {
          suggestions.push(def.name + ": value out of range (" + def.min + "-" + def.max + ") in '" + part + "'");
        }
      } else {
        suggestions.push(def.name + ": invalid value '" + part + "' (range: " + def.min + "-" + def.max + ")");
      }
    } else {
      fields.push({ index: i, name: def.name, value: part, error: false });
    }
  });
  return { valid: allValid, fields, suggestions };
}

function getDayCounts(fireTimes) {
  const counts = {};
  for (const t of fireTimes) { const k=t.getMonth()+"-"+t.getDate(); counts[k]=(counts[k]||0)+1; }
  return counts;
}

function HeatCell({count,maxCount,color,isToday,tooltip,onClick,accentColor}) {
  const intensity = count===0?0:Math.max(0.15,Math.min(1,count/Math.max(maxCount,1)));
  const bg = count===0?"transparent":color+Math.round(intensity*200).toString(16).padStart(2,"0");
  const border = isToday?"1px solid "+(accentColor||"#06b6d4"):count>0?"1px solid "+color+"22":"1px solid transparent";
  const ref = useRef(null);
  return React.createElement("div",{
    ref, onClick, title:tooltip, role:"gridcell", "aria-label":tooltip,
    style:{width:13,height:13,backgroundColor:bg,border,borderRadius:2,cursor:count>0?"pointer":"default",transition:"all 0.15s",position:"relative"},
    onMouseEnter:()=>{if(count>0&&ref.current){ref.current.style.transform="scale(1.4)";ref.current.style.zIndex="10";}},
    onMouseLeave:()=>{if(ref.current){ref.current.style.transform="scale(1)";ref.current.style.zIndex="1";}},
    tabIndex:count>0?0:-1,
    onKeyDown:ev=>{if(count>0&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();onClick&&onClick();}},
  });
}

function CalendarHeatmap({expressions,year,onDayClick,C}) {
  const today = new Date();
  const isCurrentYear = today.getFullYear()===year;
  const allData = useMemo(()=>expressions.filter(e=>e.parsed).map((e,i)=>({
    counts:getDayCounts(getFireTimes(e.parsed,year)),color:EC[i%EC.length],
  })),[expressions,year]);
  const mergedMax = useMemo(()=>{let m=0;for(const d of allData)for(const v of Object.values(d.counts))if(v>m)m=v;return m;},[allData]);

  return React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:6},role:"grid","aria-label":"Execution heatmap for "+year},
    MONTHS.map((mName,mIdx)=>{
      const dim=new Date(year,mIdx+1,0).getDate();
      const firstDow=new Date(year,mIdx,1).getDay();
      const weeks=[];let week=new Array(firstDow).fill(null);
      for(let d=1;d<=dim;d++){week.push(d);if(week.length===7){weeks.push(week);week=[];}}
      if(week.length>0){while(week.length<7)week.push(null);weeks.push(week);}
      return React.createElement("div",{key:mIdx,style:{display:"flex",alignItems:"flex-start",gap:8},role:"row"},
        React.createElement("div",{style:{width:32,fontSize:11,color:C.textDim,fontFamily:"'JetBrains Mono',monospace",paddingTop:2,textAlign:"right",flexShrink:0}},mName),
        React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:1}},
          weeks.map((w,wi)=>React.createElement("div",{key:wi,style:{display:"flex",gap:1}},
            w.map((day,di)=>{
              if(day===null) return React.createElement("div",{key:di,style:{width:13,height:13}});
              const key=mIdx+"-"+day;
              const isTodayCell=isCurrentYear&&today.getMonth()===mIdx&&today.getDate()===day;
              const totalCount=allData.reduce((s,d)=>s+(d.counts[key]||0),0);
              const domIdx=allData.reduce((best,d,i)=>{const c=d.counts[key]||0;return c>(best.count||0)?{idx:i,count:c}:best;},{idx:0,count:0}).idx;
              const color=allData.length>0?allData[domIdx].color:C.accent;
              return React.createElement(HeatCell,{key:di,count:totalCount,maxCount:mergedMax,color,isToday:isTodayCell,accentColor:C.accent,
                tooltip:mName+" "+day+": "+totalCount+" execution"+(totalCount!==1?"s":""),
                onClick:()=>totalCount>0&&onDayClick&&onDayClick(year,mIdx,day)});
            })
          ))
        )
      );
    })
  );
}

function DayDetail({year,month,day,expressions,onClose,C}) {
  const date=new Date(year,month,day);
  const dayName=DAYS[date.getDay()];
  const details=expressions.filter(e=>e.parsed).map((e,i)=>{
    const times=getFireTimes(e.parsed,year).filter(t=>t.getMonth()===month&&t.getDate()===day);
    return {expr:e,color:EC[i%EC.length],times,index:i};
  }).filter(d=>d.times.length>0);

  return React.createElement("div",{style:{background:C.surfaceAlt,border:"1px solid "+C.border,borderRadius:10,padding:16,marginTop:12,animation:"slideIn 0.2s ease"}},
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
      React.createElement("div",{style:{fontSize:14,fontWeight:600,color:C.text,fontFamily:"'JetBrains Mono',monospace"}},dayName+", "+MONTHS[month]+" "+day+", "+year),
      React.createElement("button",{onClick:onClose,style:{background:"none",border:"none",color:C.textDim,cursor:"pointer",fontSize:18,lineHeight:1,padding:"2px 6px"}},"\u00d7")
    ),
    details.map((d,i)=>React.createElement("div",{key:i,style:{marginBottom:i<details.length-1?10:0}},
      React.createElement("div",{style:{fontSize:11,color:d.color,fontFamily:"'JetBrains Mono',monospace",marginBottom:4,display:"flex",alignItems:"center",gap:6}},
        React.createElement("span",{style:{width:8,height:8,borderRadius:"50%",background:d.color,flexShrink:0}}),
        (d.expr.label||d.expr.value)+" \u2014 "+d.times.length+" run"+(d.times.length!==1?"s":"")
      ),
      React.createElement("div",{style:{display:"flex",flexWrap:"wrap",gap:4,paddingLeft:14}},
        d.times.slice(0,48).map((t,j)=>React.createElement("span",{key:j,style:{fontSize:10,color:C.textDim,background:d.color+"15",padding:"2px 6px",borderRadius:4,fontFamily:"'JetBrains Mono',monospace"}},
          String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")
        )),
        d.times.length>48?React.createElement("span",{style:{fontSize:10,color:C.textMuted}},"+"+( d.times.length-48)+" more"):null
      )
    ))
  );
}

function StatsPanel({expressions,year,C}) {
  const stats=useMemo(()=>expressions.filter(e=>e.parsed).map((e,i)=>{
    const estimated = estimateFireCount(e.parsed, year);
    const capped = estimated > FIRE_COUNT_CAP;
    const times=getFireTimes(e.parsed,year,capped?5000:undefined);
    const dayCounts=getDayCounts(times);
    const activeDays=Object.keys(dayCounts).length;
    const maxPerDay=Math.max(0,...Object.values(dayCounts));
    const hourDist=new Array(24).fill(0);const dowDist=new Array(7).fill(0);
    for(const t of times){hourDist[t.getHours()]++;dowDist[t.getDay()]++;}
    return {label:e.label||e.value,color:EC[i%EC.length],total:capped?estimated:times.length,activeDays,maxPerDay,
      peakHour:hourDist.indexOf(Math.max(...hourDist)),peakDow:dowDist.indexOf(Math.max(...dowDist)),
      avgPerDay:activeDays>0?((capped?estimated:times.length)/activeDays).toFixed(1):"0",capped,estimated};
  }),[expressions,year]);
  if(stats.length===0) return null;

  return React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:8}},
    stats.map((s,i)=>React.createElement("div",{key:i,style:{background:C.surfaceAlt,border:"1px solid "+C.border,borderRadius:10,padding:14}},
      React.createElement("div",{style:{fontSize:11,color:s.color,fontFamily:"'JetBrains Mono',monospace",marginBottom:10,display:"flex",alignItems:"center",gap:6,borderBottom:"1px solid "+C.border,paddingBottom:8}},
        React.createElement("span",{style:{width:8,height:8,borderRadius:"50%",background:s.color,flexShrink:0}}),s.label
      ),
      s.capped?React.createElement("div",{style:{fontSize:10,color:C.orange,background:C.orange+"15",padding:"4px 8px",borderRadius:6,marginBottom:8,display:"flex",alignItems:"center",gap:4},role:"alert"},
        React.createElement("svg",{width:12,height:12,viewBox:"0 0 24 24",fill:"none",stroke:C.orange,strokeWidth:2,"aria-hidden":"true"},
          React.createElement("path",{d:"M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"}),
          React.createElement("line",{x1:12,y1:9,x2:12,y2:13}),React.createElement("line",{x1:12,y1:17,x2:12.01,y2:17})
        ),

// --- URL state helpers ---
function encodeURLState(expressions, year) {
  const params = new URLSearchParams();
  expressions.forEach((e, i) => {
    if (e.value.trim()) {
      params.set("expr" + (i > 0 ? i : ""), e.value);
      if (e.label.trim()) params.set("label" + (i > 0 ? i : ""), e.label);
    }
  });
  params.set("year", String(year));
  return params.toString();
}

function decodeURLState() {
  const params = new URLSearchParams(window.location.search);
  const exprs = [];
  // Check expr, expr1, expr2, ... up to 20
  for (let i = 0; i < 20; i++) {
    const key = i === 0 ? "expr" : "expr" + i;
    const val = params.get(key);
    if (val !== null) {
      const labelKey = i === 0 ? "label" : "label" + i;
      exprs.push({ value: val, label: params.get(labelKey) || "" });
    }
  }
  const year = params.has("year") ? parseInt(params.get("year"), 10) : null;
  return { exprs: exprs.length > 0 ? exprs : null, year: year && !isNaN(year) ? year : null };
}

// --- localStorage schedule sets ---
function loadScheduleSets() {
  try { return JSON.parse(localStorage.getItem("cronscope_sets") || "[]"); } catch { return []; }
}
function saveScheduleSets(sets) {
  try { localStorage.setItem("cronscope_sets", JSON.stringify(sets)); } catch {}

// --- Theme persistence ---
function loadTheme() {
  try { return localStorage.getItem("cronscope_theme") || "dark"; } catch { return "dark"; }
}
function saveTheme(t) {
  try { localStorage.setItem("cronscope_theme", t); } catch {}
}

// --- Crontab import parser ---
function parseCrontabLines(text) {
  return text.split("\n")
    .map(l => l.trim())
    .filter(l => l && !l.startsWith("#"))
    .map(line => {
      // Handle aliases
      if (line.startsWith("@")) {
        const parts = line.split(/\s+/);
        const alias = parts[0];
        const cmd = parts.slice(1).join(" ");
        return { value: alias, label: cmd ? cmd.split("/").pop().split(" ")[0] : alias };
      }
      const parts = line.split(/\s+/);
      if (parts.length >= 5) {
        const expr = parts.slice(0, 5).join(" ");
        const cmd = parts.slice(5).join(" ");
        const label = cmd ? cmd.split("/").pop().split(" ")[0] : "";
        return { value: expr, label: label || expr };
      }
      return null;
    })
    .filter(Boolean);
}

// --- Markdown report generator ---
function generateMarkdownReport(expressions, year) {
  const lines = [];
  lines.push("# CronScope Schedule Report");
  lines.push("");
  lines.push("**Year:** " + year);
  lines.push("**Generated:** " + new Date().toISOString().slice(0, 10));
  lines.push("");
  const valid = expressions.filter(e => e.parsed);
  if (valid.length === 0) { lines.push("No valid expressions."); return lines.join("\n"); }
  lines.push("## Expressions");
  lines.push("");
  lines.push("| # | Label | Expression | Description |");
  lines.push("|---|-------|------------|-------------|");
  valid.forEach((e, i) => {
    lines.push("| " + (i + 1) + " | " + (e.label || "-") + " | `" + e.value + "` | " + describeCron(e.value) + " |");
  });
  lines.push("");
  lines.push("## Statistics");
  lines.push("");
  lines.push("| Label | Runs/Year | Active Days | Max/Day | Avg/Active Day | Peak Hour | Peak Day |");
  lines.push("|-------|-----------|-------------|---------|----------------|-----------|----------|");
  valid.forEach((e, i) => {
    const times = getFireTimes(e.parsed, year);
    const dayCounts = getDayCounts(times);
    const activeDays = Object.keys(dayCounts).length;
    const maxPerDay = Math.max(0, ...Object.values(dayCounts));
    const hourDist = new Array(24).fill(0); const dowDist = new Array(7).fill(0);
    for (const t of times) { hourDist[t.getHours()]++; dowDist[t.getDay()]++; }
    const peakHour = hourDist.indexOf(Math.max(...hourDist));
    const peakDow = dowDist.indexOf(Math.max(...dowDist));
    const avg = activeDays > 0 ? (times.length / activeDays).toFixed(1) : "0";
    lines.push("| " + (e.label || e.value) + " | " + times.length.toLocaleString() + " | " + activeDays + " | " + maxPerDay + " | " + avg + " | " + String(peakHour).padStart(2, "0") + ":00 | " + DAYS[peakDow] + " |");
  });
  // Conflicts
  if (valid.length >= 2) {
    const conflicts = [];
    for (let i = 0; i < valid.length; i++) {
      for (let j = i + 1; j < valid.length; j++) {
        const setA = new Set(getFireTimes(valid[i].parsed, year, 2000).map(t => t.getTime()));
        const timesB = getFireTimes(valid[j].parsed, year, 2000);
        let overlap = 0; for (const t of timesB) if (setA.has(t.getTime())) overlap++;
        if (overlap > 0) conflicts.push({ a: valid[i].label || valid[i].value, b: valid[j].label || valid[j].value, overlap });
      }
    }
    if (conflicts.length > 0) {
      lines.push("");
      lines.push("## Conflicts");
      lines.push("");
      conflicts.forEach(c => {
        lines.push("- **" + c.a + "** overlaps with **" + c.b + "** -- " + c.overlap.toLocaleString() + " shared execution(s)");
      });
    }
  }
  lines.push("");
  lines.push("---");
  lines.push("*Generated by [CronScope](https://sysadmindoc.github.io/CronScope/)*");
  return lines.join("\n");
}
